<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sky High Advertisers | 360° Marketing & Business Growth Agency</title>
<meta name="description" content="Integrated digital and traditional marketing strategies that build brands, attract qualified customers and deliver measurable growth.">

<script type="application/ld+json">{"@context":"https://schema.org","@type":"MarketingAgency","name":"Sky High Advertisers","description":"360-degree marketing, advertising and business growth agency.","url":"[YOUR-DOMAIN]","Email":"[YOUR-EMAIL]","telephone":"[YOUR-PHONE]"}</script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f7f8fb;--fg:#0e1a2f;--mut:#56627a;--card:#fff;--line:#e1e5ee;--ac:#e8a317;--ac2:#1f6feb;--navy:#0b1730}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1222;--fg:#eaf0fb;--mut:#9fb0cc;--card:#111d35;--line:#22314f;--navy:#060d1b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a1222;--fg:#eaf0fb;--mut:#9fb0cc;--card:#111d35;--line:#22314f;--navy:#060d1b;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;line-height:1.15;margin:0 0 .5em;letter-spacing:-.01em}
h1{font-size:clamp(2.1rem,5.5vw,3.6rem)}h2{font-size:clamp(1.6rem,3.5vw,2.4rem)}h3{font-size:1.15rem}
a{color:inherit}.w{max-width:1120px;margin:auto;padding:0 20px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
nav{display:flex;align-items:center;gap:6px;padding:12px 0;flex-wrap:wrap}
.logo{font:700 1.2rem Georgia,serif;text-decoration:none;margin-right:auto}.logo b{color:var(--ac)}
nav a.l{text-decoration:none;font-size:.9rem;padding:6px 10px;border-radius:8px;color:var(--mut)}nav a.l:hover,nav a.on{color:var(--fg);background:var(--card)}
.btn{display:inline-block;padding:12px 22px;border-radius:10px;font-weight:600;text-decoration:none;border:1px solid transparent;cursor:pointer;font-size:1rem;transition:transform .2s}
.btn:hover{transform:translateY(-2px)}.p{background:var(--ac);color:#1a1200}.s{border-color:var(--line);background:var(--card);color:var(--fg)}
.hero{background:var(--navy);color:#eaf0fb;padding:64px 0;position:relative;overflow:hidden}
.hero .w{display:grid;grid-template-columns:1.1fr .9fr;gap:36px;align-items:center}.hero p{color:#b8c6e0;font-size:1.1rem}.hero h1 em{color:var(--ac);font-style:normal}
.hero .s{background:transparent;color:#eaf0fb;border-color:#3a4c73}
section{padding:60px 0}.alt{background:var(--card);border-block:1px solid var(--line)}
.eyebrow{color:var(--ac2);font-weight:700;font-size:.8rem;letter-spacing:.12em;text-transform:uppercase}
.g{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.c{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;transition:transform .25s,box-shadow .25s}.c:hover{transform:translateY(-4px);box-shadow:0 10px 30px rgba(0,0,0,.08)}
.alt .c{background:var(--bg)}.c ul{padding-left:18px;margin:8px 0 0;color:var(--mut);font-size:.92rem}.c p{color:var(--mut);margin:.3em 0}
.n{font:700 2rem Georgia,serif;color:var(--ac)}.chips{display:flex;flex-wrap:wrap;gap:10px}.chip{border:1px solid var(--line);background:var(--card);padding:8px 14px;border-radius:999px;font-size:.92rem}
.ph{border:1px dashed var(--ac);color:var(--ac);padding:2px 8px;border-radius:6px;font-size:.85rem;font-weight:600}
form{display:grid;gap:12px;grid-template-columns:1fr 1fr}form .f{grid-column:1/-1}label{font-size:.85rem;color:var(--mut);display:grid;gap:4px}
input,select,textarea{font:inherit;padding:11px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--fg);width:100%}
.alt input,.alt select,.alt textarea{background:var(--card)}
footer{background:var(--navy);color:#9fb0cc;padding:40px 0;font-size:.9rem}footer a{color:#eaf0fb;margin-right:14px}
#ck{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));background:var(--navy);color:#eaf0fb;padding:14px 18px;border-radius:12px;display:none;gap:12px;align-items:center;flex-wrap:wrap;z-index:30;border:1px solid #3a4c73}
#wa{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));background:#25d366;color:#04210f;font-weight:700;padding:12px 16px;border-radius:999px;text-decoration:none;z-index:25}
.pg{display:none;animation:in .4s}.pg.on{display:block}@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
@media(max-width:800px){.hero .w{grid-template-columns:1fr}form{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head>
<body>
<header><div class="w"><nav aria-label="Main"><a class="logo" href="#home">Sky High <b>Advertisers</b></a><span id="nv"></span><a class="btn p" href="#consultation" style="padding:8px 16px">Free Consultation</a></nav></div></header>
<main id="app"></main>
<footer><div class="w"><p><b style="color:#eaf0fb">Sky High Advertisers</b> — 360° marketing and business growth partner.</p><p><a href="#privacy">Privacy Policy</a><a href="#contact">Contact</a><a href="#consultation">Free Consultation</a></p><p>© <span id="yr"></span> Sky High Advertisers. <span class="ph">[Company registration / address]</span></p></div></footer>
<a id="wa" href="https://wa.me/910000000000?text=Hi%2C%20I%27d%20like%20a%20free%20marketing%20consultation" target="_blank" rel="noopener">WhatsApp</a>
<div id="ck" role="dialog" aria-label="Cookie consent"><span>We use cookies for analytics and advertising measurement. See our <a href="#privacy" style="color:var(--ac)">Privacy Policy</a>.</span><button class="btn p" id="ok" style="padding:8px 16px">Accept</button><button class="btn s" id="no" style="padding:8px 16px">Decline</button></div>
<script>
const B="Sky High Advertisers",EM="hello@your-domain.com",WA="910000000000";
const SV=[
["Digital Performance Marketing","📈",["Google Ads Management","Google Search Advertising","Google Display Advertising","Performance Max Campaigns","Shopping Campaigns","YouTube Advertising","Remarketing and Retargeting","Lead Generation Campaigns","Conversion Rate Optimization","Campaign Performance Monitoring"]],
["Social Media Marketing","💬",["Facebook and Instagram Advertising","LinkedIn Advertising","Social Media Management","Paid Social Campaigns","Brand Awareness Campaigns","Audience Targeting","Influencer Marketing","Content Marketing"]],
["Traditional and Offline Marketing","🏙️",["Billboard Advertising","Outdoor Advertising","Transit Advertising","Newspaper and Magazine Advertising","Radio and Television Advertising","Event Promotions","Local Area Marketing","Print Advertising","Promotional Campaigns"]],
["Brand Development and Awareness","🧭",["Brand Positioning","Brand Identity Development","Brand Awareness Strategies","Market Research","Competitor Analysis","Audience Research","Marketing Strategy Development","Product and Service Positioning"]],
["Business Growth and Marketing Analytics","📊",["ROAS Optimization","CPA Management","Conversion Tracking","Marketing Attribution","Audience Segmentation","Campaign Performance Analysis","Marketing Budget Allocation","Regular Performance Reporting"]]];
const ST=[["Understand the Business","We understand your products, services, objectives, target audience and revenue goals."],["Research and Strategy","We research the market, analyze competitors, identify opportunities and build a customized strategy."],["Multi-Channel Marketing","We choose the right mix of Google Ads, social, display, outdoor, traditional media and more."],["Campaign Execution","We plan, launch and manage campaigns across the selected channels."],["Monitor and Optimize","We track impressions, reach, engagement, traffic, leads, conversions, ROAS and CPA."],["Scale Business Growth","We back what performs, optimize budgets and expand successful campaigns."]];
const IN=["E-commerce and Retail","Healthcare and Wellness","Real Estate","Education and E-learning","Hospitality and Restaurants","Professional Services","Automotive","Manufacturing","Technology and SaaS","Home Improvement and Local Services","Startups and Emerging Businesses","Enterprise Businesses"];
const WY=["Customized marketing strategies for every business","Integrated online and offline marketing solutions","Data-driven campaign management","Transparent performance monitoring","Focus on qualified traffic, not just website visits","Continuous campaign optimization","Strategic marketing budget allocation","Focus on maximizing ROAS and controlling CPA","Dedicated marketing consultation","Scalable solutions for businesses of every size"];
const ph=t=>`<span class="ph">[${t}]</span>`;
const hd=(e,t,s)=>`<div class="eyebrow">${e}</div><h2>${t}</h2>${s?`<p style="color:var(--mut);max-width:680px">${s}</p>`:""}`;
const sv=(full)=>`<div class="g">${SV.map(s=>`<div class="c"><div style="font-size:1.6rem">${s[1]}</div><h3>${s[0]}</h3>${full?`<ul>${s[2].map(x=>`<li>${x}</li>`).join("")}</ul>`:`<p>${s[2].slice(0,4).join(" · ")} and more.</p>`}</div>`).join("")}</div>`;
const ap=()=>`<div class="g">${ST.map((s,i)=>`<div class="c"><div class="n">0${i+1}</div><h3>${s[0]}</h3><p>${s[1]}</p></div>`).join("")}</div>`;
const ind=()=>`<div class="chips">${IN.map(x=>`<span class="chip">${x}</span>`).join("")}</div>`;
const why=()=>`<div class="g">${WY.map(x=>`<div class="c"><p style="color:var(--fg)">✔ ${x}</p></div>`).join("")}</div>`;
const opt=a=>a.map(x=>`<option>${x}</option>`).join("");
const form=(id,t)=>`<form data-f="${id}" aria-label="${t}"><label>Business name<input name="Business name" required></label><label>Contact person<input name="Contact person" required></label><label>Email address<input type="email" name="Email" required></label><label>Phone number<input type="tel" name="Phone" required></label><label>Website URL<input type="url" name="Website" placeholder="https://"></label><label>Industry<select name="Industry">${opt(IN)}</select></label><label class="f">Marketing services required<select name="Services" multiple size="5">${opt(SV.map(s=>s[0]).concat(["Not sure — advise me"]))}</select></label><label>Monthly marketing budget<select name="Budget">${opt(["Under [CURRENCY] [X]","[CURRENCY] [X] – [Y]","[CURRENCY] [Y]+","Not decided"])}</select></label><label>Primary business objective<select name="Objective">${opt(["Generate leads","Increase sales","Build brand awareness","Launch a new product","Improve ROAS / lower CPA","Other"])}</select></label><label class="f">Requirements<textarea name="Requirements" rows="3"></textarea></label><div class="f"><button class="btn p" type="submit">${t}</button> <a class="btn s" href="https://wa.me/${WA}" target="_blank" rel="noopener">Chat on WhatsApp</a> <a class="btn s" href="mailto:${EM}">Email us</a><p id="m-${id}" style="color:var(--mut);font-size:.85rem"></p></div></form>`;
const sec=(c,a)=>`<section class="${a?"alt":""}"><div class="w">${c}</div></section>`;
const ph1=(e,t,s)=>`<section style="padding:48px 0"><div class="w">${hd(e,t,s)}</div></section>`;
const art=`<svg viewBox="0 0 420 300" role="img" aria-label="Marketing analytics dashboard illustration" style="width:100%"><rect x="6" y="6" width="408" height="288" rx="16" fill="#111d35" stroke="#2c3e66"/><g fill="#1b2b4d"><rect x="22" y="22" width="120" height="58" rx="8"/><rect x="150" y="22" width="120" height="58" rx="8"/><rect x="278" y="22" width="120" height="58" rx="8"/></g><g fill="#9fb0cc" font-size="10" font-family="system-ui"><text x="34" y="42">ROAS</text><text x="162" y="42">CPA</text><text x="290" y="42">Leads</text></g><g fill="#e8a317" font-size="18" font-weight="700" font-family="system-ui"><text x="34" y="68">—</text><text x="162" y="68">—</text><text x="290" y="68">—</text></g><rect x="22" y="96" width="250" height="176" rx="8" fill="#1b2b4d"/><polyline points="36,250 80,220 120,232 170,170 220,150 258,116" fill="none" stroke="#e8a317" stroke-width="3"/><polyline points="36,256 80,244 120,236 170,214 220,200 258,186" fill="none" stroke="#1f6feb" stroke-width="3"/><rect x="284" y="96" width="114" height="176" rx="8" fill="#1b2b4d"/><g fill="#1f6feb"><rect x="298" y="200" width="16" height="56"/><rect x="322" y="170" width="16" height="86"/><rect x="346" y="140" width="16" height="116" fill="#e8a317"/><rect x="370" y="116" width="16" height="140"/></g></svg>`;
const P={
home:[`${B} | 360° Marketing & Business Growth Agency`,"Integrated digital and traditional marketing strategies that turn marketing investment into measurable growth.",()=>`<div class="hero"><div class="w"><div><div class="eyebrow" style="color:var(--ac)">360° Marketing · Advertising · Growth</div><h1>Your Growth. <em>Our Strategy.</em> Measurable Results</h1><p>From digital advertising to traditional media, we create integrated marketing strategies that build powerful brands, attract the right audiences and turn marketing investments into measurable business growth.</p><p><a class="btn p" href="#consultation">Get a Free Marketing Consultation</a> <a class="btn s" href="#services">Explore Our Services</a></p></div>${art}</div></div>`
+sec(hd("Trusted partner","Your Trusted Marketing and Growth Partner","We combine digital advertising, traditional media, brand strategy and analytics to help startups, SMBs and enterprises grow sustainably — with a strategy built around your business, not a template.")+`<p>${ph("Client logos / partner badges — add only real, approved ones")}</p>`)
+sec(hd("Our Marketing Solutions","Five Disciplines. One Integrated Plan.")+sv(0),1)
+sec(hd("One agency","One Agency. Every Marketing Opportunity.")+`<div class="chips">${["Google Ads","YouTube","Performance Max","Meta Ads","LinkedIn","Influencers","Billboards","Transit","Print","Radio & TV","Events","Local Area"].map(x=>`<span class="chip">${x}</span>`).join("")}</div>`)
+sec(hd("Our Strategic Approach","From Understanding to Scale in Six Steps")+ap(),1)
+sec(hd("Industries","Industries We Empower")+ind())
+sec(hd("Performance and Growth Metrics","What We Measure — and Report Transparently")+`<div class="g">${["ROAS","CPA","Qualified Leads","Conversion Rate"].map(m=>`<div class="c"><div class="n">${ph("Verified figure")}</div><h3>${m}</h3><p>Tracked and reported regularly. Publish only real, verifiable results.</p></div>`).join("")}</div>`,1)
+sec(hd("Why Businesses Choose Us","Built for Credibility, Clarity and Performance")+why())
+sec(`<div style="text-align:center">${hd("Let’s Build Your Growth Strategy","Tell us your goals. We’ll map the channels.")}<a class="btn p" href="#consultation">Request a Free Consultation</a></div>`,1)
+sec(hd("Contact","Send Us Your Requirements")+form("home","Submit Enquiry"))],
about:["About Us","About our 360° marketing and business growth agency.",()=>ph1("About Us","A Strategic Partner for the Complete Marketing Ecosystem","We help startups, small businesses, medium-sized companies and large enterprises increase visibility, attract qualified customers, generate leads, drive sales and build a lasting market presence.")
+sec(`<div class="g"><div class="c"><h3>What we do</h3><p>End-to-end marketing combining digital advertising, traditional advertising, brand awareness, performance marketing and innovative promotions.</p></div><div class="c"><h3>How we think</h3><p>No one-size-fits-all. We study your business model, audience, industry, competition, budget and objectives first.</p></div><div class="c"><h3>What we aim for</h3><p>Sustainable growth with maximized ROAS, efficient CPA and improved overall marketing performance.</p></div></div><p style="margin-top:24px">${ph("Founder / team bios, company history, certifications — add only real information")}</p>`)],
services:["Our Services","Digital performance, social, traditional, brand and analytics services.",()=>ph1("Our Services","Complete Marketing Services Under One Roof")+sec(sv(1))+sec(hd("Service enquiry","Enquire About a Specific Service")+form("svc","Send Service Enquiry"),1)],
industries:["Industries We Serve","Marketing for e-commerce, healthcare, real estate, education, hospitality and more.",()=>ph1("Industries We Serve","Industry-Specific Marketing Expertise","Every sector has its own buyers, competitors and economics. We tailor the channel mix accordingly.")+sec(ind()+`<p style="margin-top:20px">${ph("Industry-specific proof points — real data only")}</p>`)],
approach:["Our Marketing Approach","Our six-step methodology from business discovery to scaled growth.",()=>ph1("Our Marketing Approach","A Method Built Around Measurable Outcomes")+sec(ap())],
cases:["Case Studies","Case studies from our client work.",()=>ph1("Case Studies","Results, Told Honestly","Case studies will appear here once real, client-approved work is available.")+sec(`<div class="g">${[1,2,3].map(i=>`<div class="c"><h3>${ph("Client / industry")}</h3><p><b>Challenge:</b> ${ph("Real brief")}</p><p><b>Strategy:</b> ${ph("Channels used")}</p><p><b>Results:</b> ${ph("Verified, client-approved metrics")}</p></div>`).join("")}</div>`)],
insights:["Insights / Marketing Blog","Marketing insights on Google Ads, ROAS, CPA, brand and growth.",()=>ph1("Insights","Marketing Insights and Practical Playbooks")+sec(`<div class="g">${["How to lower CPA without cutting reach","Search vs. Performance Max: when to use which","Measuring offline campaigns with local attribution","Allocating a marketing budget across channels"].map(t=>`<article class="c"><h3>${t}</h3><p>${ph("Article to be written")}</p></article>`).join("")}</div>`)],
contact:["Contact Us","Contact us by form, email or WhatsApp.",()=>ph1("Contact Us","Let’s Talk About Your Growth")+sec(`<p>Email: ${ph("your email")} · Phone: ${ph("your phone")} · Address: ${ph("your address")}</p>`+form("ct","Submit Enquiry"),1)],
consultation:["Request a Free Marketing Consultation","Book a free marketing consultation with our strategy team.",()=>ph1("Free consultation","Request a Free Marketing Consultation","Share your requirements and we’ll propose a customized plan. Booking link: "+ph("Calendly / booking URL"))+sec(form("cs","Request My Free Consultation"),1)],
privacy:["Privacy Policy","Privacy and cookie policy.",()=>ph1("Privacy Policy","Privacy and Cookies")+sec(`<p>${ph("Insert legally reviewed privacy policy: data collected via forms, analytics (GA4/GTM), advertising pixels, retention, user rights, contact")}</p>`)]};
const NV=[["home","Home"],["about","About"],["services","Services"],["industries","Industries"],["approach","Approach"],["cases","Case Studies"],["insights","Insights"],["contact","Contact"]];
document.getElementById("nv").innerHTML=NV.map(n=>`<a class="l" data-r="${n[0]}" href="#${n[0]}">${n[1]}</a>`).join("");
document.getElementById("yr").textContent=new Date().getFullYear();
function route(){let r=location.hash.slice(1);if(!P[r])r="home";const p=P[r];document.title=r=="home"?p[0]:p[0]+" | "+B;
let m=document.querySelector('meta[name=description]');m.content=p[1];
document.getElementById("app").innerHTML=`<div class="pg on">${p[2]()}</div>`;
document.querySelectorAll("nav a.l").forEach(a=>a.classList.toggle("on",a.dataset.r==r));window.scrollTo(0,0);}
addEventListener("hashchange",route);route();
document.addEventListener("submit",e=>{const f=e.target.closest("form[data-f]");if(!f)return;e.preventDefault();
const l=[];new FormData(f).forEach((v,k)=>l.push(k+": "+v));const t=l.join("\n");
document.getElementById("m-"+f.dataset.f).innerHTML=`Almost done — <a href="mailto:${EM}?subject=${encodeURIComponent("Marketing enquiry")}&body=${encodeURIComponent(t)}">send by email</a> or <a href="https://wa.me/${WA}?text=${encodeURIComponent(t)}" target="_blank" rel="noopener">send on WhatsApp</a>. (Connect a backend or form service to submit directly.)`;});
const ck=document.getElementById("ck");let got=null;try{got=localStorage.getItem("ck")}catch(e){}
if(!got)ck.style.display="flex";
function setC(v){try{localStorage.setItem("ck",v)}catch(e){}ck.style.display="none";/* if v==="yes": load GTM/GA/Pixel here */}
document.getElementById("ok").onclick=()=>setC("yes");document.getElementById("no").onclick=()=>setC("no");
</script></body></html>
